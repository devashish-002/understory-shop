<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to your Understory plant shop account." />
    <title>Sign in | Understory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-page">
    <main class="login-layout">
      <section class="login-photo" aria-label="A sunlit indoor plant">
        <img
          src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1600&q=85"
          alt="Lush green houseplants in a bright room"
        />
        <div class="login-photo-copy">
          <p>Make room for green</p>
          <h2>Good things grow here.</h2>
        </div>
      </section>

      <section class="login-side" aria-labelledby="loginTitle">
        <a class="login-brand" href="index.html" aria-label="Understory home">
          <span class="brand-mark" aria-hidden="true">U</span>
          <strong>Understory</strong>
        </a>

        <div class="login-content">
          <p class="login-eyebrow">Your little corner of green</p>
          <h1 id="loginTitle">Welcome back to your corner.</h1>
          <p class="login-intro">Sign in to pick up where your plants left off.</p>

          <form class="login-form" id="loginForm">
            <label class="login-field" for="email">
              Email address
              <input
                id="email"
                name="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </label>

            <label class="login-field" for="password">
              Password
              <span class="password-wrap">
                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                  required
                />
                <button class="password-toggle" id="passwordToggle" type="button" aria-controls="password" aria-pressed="false">Show</button>
              </span>
            </label>

            <button class="primary-btn login-submit" type="submit">Sign in</button>
            <p class="login-status" id="loginStatus" aria-live="polite"></p>
          </form>

          <p class="login-footnote" id="authModePrompt">
            <span id="authModePromptText">New to Understory?</span>
            <button class="auth-mode-toggle" id="authModeToggle" type="button">Create an account</button>
          </p>

          <div class="account-panel" id="accountPanel" hidden>
            <p class="login-intro">Signed in as <strong id="accountEmail"></strong></p>
            <button class="primary-btn login-submit" id="accountLogoutBtn" type="button">Sign out</button>
          </div>

          <p class="login-footnote">Just browsing? <a href="index.html">Continue to the shop</a></p>
          <p class="login-status" id="accountStatus" aria-live="polite"></p>
        </div>

        <p class="login-disclaimer">Thoughtfully grown, right at home.</p>
      </section>
    </main>
    <script src="api.js"></script>
    <script src="login.js"></script>
  </body>
</html>
